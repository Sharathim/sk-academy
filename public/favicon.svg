  <path d="M84 37 V48 L86 50" fill="none" stroke="#F4B942" stroke-width="1.5" stroke-linecap="round" />

  <!-- Monogram "SK" -->
  <text x="64" y="94" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SK</text>

  <!-- Bottom Accent Dot -->
