      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D62828" />
      <stop offset="100%" stop-color="#A4161A" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#333333" stroke-width="2" />
  
  <!-- Top Red Academic Crest Line -->
